# ---------------------------------------------------------------------------
# Bangla & English ASR Studio — production stack (CPU by default)
#
#   docker compose up -d --build       ->  UI http://localhost:8080
#                                          API http://localhost:8000
#
# Runs anywhere Docker runs: Linux, macOS (Intel + Apple Silicon), Windows.
# Copy .env.example to .env to change ports, model cache, or thread counts.
#
# Variants (compose overrides, applied on top of this file):
#   GPU  : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   DEV  : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ---------------------------------------------------------------------------

# Bounded JSON logs — the default driver grows without limit and is a common
# cause of a full disk on long-lived deployments.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # CPU wheels by default; docker-compose.gpu.yml swaps in the CUDA index.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        INSTALL_TRAINING: ${INSTALL_TRAINING:-false}
    image: bangla-asr-backend:latest
    container_name: bangla-asr-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      ASR_HOST: 0.0.0.0
      ASR_PORT: 8000
      ASR_CORS_ORIGINS: ${ASR_CORS_ORIGINS:-*}
      ASR_LOG_LEVEL: ${ASR_LOG_LEVEL:-INFO}
      ASR_JOB_RETENTION_SECONDS: ${ASR_JOB_RETENTION_SECONDS:-21600}
      ASR_JOB_HISTORY_LIMIT: ${ASR_JOB_HISTORY_LIMIT:-200}
      ASR_MAX_UPLOAD_BYTES: ${ASR_MAX_UPLOAD_BYTES:-536870912}
      ASR_MAX_BATCH_FILES: ${ASR_MAX_BATCH_FILES:-200}
      HF_HOME: /app/models
      HF_HUB_CACHE: /app/models
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    volumes:
      # Model weights and datasets live on the host — images stay small and the
      # multi-GB Whisper download survives image rebuilds.
      - ./models:/app/models
      # Datasets are read-only by default: the API only ever reads them. Set
      # DATA_MOUNT_MODE=rw when running dataset-preparation jobs in-container.
      - ./data:/app/data:${DATA_MOUNT_MODE:-ro}
      - ./checkpoints:/app/checkpoints
      - ./backups:/app/backups
      - asr-tmp:/app/.tmp
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [asr]
    deploy:
      resources:
        limits:
          # Whisper large-v3-turbo needs headroom; raise on a bigger host.
          memory: ${BACKEND_MEMORY_LIMIT:-8g}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        # Empty => same-origin requests, reverse-proxied to the backend by nginx.
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: bangla-asr-frontend:latest
    container_name: bangla-asr-frontend
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [asr]

volumes:
  asr-tmp:

networks:
  asr:
    driver: bridge
